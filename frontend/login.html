<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - ShopHere</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="auth-page">

  <!-- Centered Single Login Card -->
  <div class="auth-single-card">
    <!-- Centered Brand Logo -->
    <div class="auth-brand-center">
      <a href="products.html" class="brand-logo" style="text-decoration:none;">
        <span class="logo-badge">SH</span>
        <span class="logo-text">ShopHere</span>
      </a>
    </div>

    <!-- Welcome Header -->
    <div class="auth-header">
      <h2>Welcome Back!</h2>
      <p>Sign in to manage your orders, track shipments &amp; enjoy member discounts.</p>
    </div>

    <!-- Quick 1-Click Demo Sign-In Bar -->
    <div class="auth-demo-banner">
      <div class="demo-title-row">
        <span>⚡ Quick Demo Sign-In</span>
        <span style="font-size:0.68rem; color:#94a3b8;">1-Click Fill</span>
      </div>
      <div class="demo-chips-grid">
        <button type="button" class="demo-chip-btn" onclick="fillDemo('buyer')">
          <svg viewBox="0 0 24 24" style="width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:2.2;"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          <span>Buyer</span>
        </button>
        <button type="button" class="demo-chip-btn seller" onclick="fillDemo('seller')">
          <svg viewBox="0 0 24 24" style="width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:2.2;"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
          <span>Seller</span>
        </button>
        <button type="button" class="demo-chip-btn admin" onclick="fillDemo('admin')">
          <svg viewBox="0 0 24 24" style="width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:2.2;"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          <span>Admin</span>
        </button>
      </div>
    </div>

    <!-- Login Form -->
    <form id="login-form">
      <!-- Email Input -->
      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-with-icon-wrap">
          <span class="input-icon-left">
            <svg viewBox="0 0 24 24" style="fill:none; stroke:currentColor; stroke-width:2;"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
          </span>
          <input type="email" id="email" name="email" placeholder="name@example.com" required autocomplete="email">
        </div>
      </div>

      <!-- Password Input with Show/Hide Toggle -->
      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-with-icon-wrap">
          <span class="input-icon-left">
            <svg viewBox="0 0 24 24" style="fill:none; stroke:currentColor; stroke-width:2;"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          </span>
          <input type="password" id="password" name="password" placeholder="Enter your account password" required autocomplete="current-password">
          <button type="button" class="btn-toggle-pwd" id="btn-toggle-pwd" onclick="togglePassword('password', this)" title="Show / Hide Password">
            <svg viewBox="0 0 24 24" style="fill:none; stroke:currentColor; stroke-width:2;"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
      </div>

      <!-- Options: Remember Me & Forgot Password -->
      <div class="auth-options-flex">
        <label class="auth-checkbox-label">
          <input type="checkbox" id="remember-me" checked>
          <span>Remember me</span>
        </label>
        <a href="javascript:void(0)" class="auth-forgot-link" onclick="handleForgotPassword()">Forgot password?</a>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn-auth-submit" id="btn-submit-login">
        <span>Sign In to Account</span>
        <svg viewBox="0 0 24 24" style="fill:none; stroke:currentColor; stroke-width:2.5;"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
      </button>
    </form>

    <!-- Social Logins Divider -->
    <div class="auth-social-divider">
      <span>Or continue with</span>
    </div>

    <!-- Social Buttons (Google & Apple) -->
    <div class="auth-social-grid">
      <button type="button" class="btn-social" onclick="handleSocialLogin('Google')">
        <svg viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span>Google</span>
      </button>

      <button type="button" class="btn-social" onclick="handleSocialLogin('Apple')">
        <svg viewBox="0 0 24 24" fill="#000000">
          <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.87c.66-.82 1.11-1.96.99-3.1-.96.04-2.13.64-2.81 1.44-.6.69-1.12 1.83-.98 2.94 1.08.08 2.16-.54 2.8-1.28z"/>
        </svg>
        <span>Apple</span>
      </button>
    </div>

    <!-- Auth Switch Links -->
    <p class="auth-switch">
      Don't have an account? <a href="register.html">Sign Up for free</a>
    </p>

    <!-- Security Notice -->
    <div class="auth-security-footer">
      <svg viewBox="0 0 24 24" style="fill:none; stroke:currentColor; stroke-width:2.5;"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
      <span>256-bit bank-grade encryption &bull; 100% secure</span>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="auth-toast" class="auth-toast">Demo credentials loaded!</div>

  <!-- Interactive Auth Helper Script -->
  <script>
    function togglePassword(inputId, btnEl) {
      const input = document.getElementById(inputId);
      if (!input) return;
      const isPwd = input.type === 'password';
      input.type = isPwd ? 'text' : 'password';
      btnEl.innerHTML = isPwd
        ? '<svg viewBox="0 0 24 24" style="fill:none; stroke:currentColor; stroke-width:2;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>'
        : '<svg viewBox="0 0 24 24" style="fill:none; stroke:currentColor; stroke-width:2;"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
    }

    function fillDemo(type) {
      const emailInput = document.getElementById('email');
      const pwdInput = document.getElementById('password');
      if (type === 'buyer') {
        emailInput.value = 'buyer@shophere.com';
        pwdInput.value = 'buyer123';
      } else if (type === 'seller') {
        emailInput.value = 'seller@shophere.com';
        pwdInput.value = 'sellerpass123';
      } else if (type === 'admin') {
        emailInput.value = 'admin@shophere.com';
        pwdInput.value = 'adminpass123';
      }
      showAuthToast(`Loaded ${type.toUpperCase()} credentials! Click 'Sign In' to proceed.`);
    }

    function handleForgotPassword() {
      const email = document.getElementById('email')?.value.trim();
      const promptEmail = prompt('Enter your registered email address for a password reset link:', email || 'himanshu@example.com');
      if (promptEmail) {
        showAuthToast(`Password reset link sent to ${promptEmail}! Check your inbox.`);
      }
    }

    function handleSocialLogin(provider) {
      showAuthToast(`Connecting with ${provider} Secure OAuth...`);
      setTimeout(() => {
        const demoSocialUser = {
          name: `${provider} Shopper`,
          email: `shopper.${provider.toLowerCase()}@shophere.com`,
          phone: "+91 98765 43210",
          address: "Flat 402, Green Valley Apartments, Bengaluru, Karnataka - 560103",
          memberSince: "October 2026",
          role: "BUYER",
          orders: []
        };
        if (typeof saveUser === 'function') {
          saveUser(demoSocialUser);
        } else {
          localStorage.setItem('ecommerce_user', JSON.stringify(demoSocialUser));
        }
        window.location.assign('products.html');
      }, 900);
    }

    function showAuthToast(msg) {
      const toast = document.getElementById('auth-toast');
      if (!toast) return;
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => { toast.classList.remove('show'); }, 3000);
    }
  </script>

  <!-- Core Authentication Script -->
  <script src="js/auth.js"></script>
</body>
</html>
