# ===================================================================
# ShopHere E-Commerce Backend Configuration
# ===================================================================

# Server Port
server.port=8080

# -------------------------------------------------------------------
# Database Connection
# Defaults to H2 In-Memory DB for instant zero-config cloud & local deployment.
# When running with MySQL, simply provide SPRING_DATASOURCE_URL, USERNAME & PASSWORD.
# -------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:ecommerce;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# -------------------------------------------------------------------
# JPA & Hibernate Settings
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# H2 Web Console (available at /h2-console when running in H2 mode)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Seed Initial 20 Products on Startup if database is empty
app.seed.products=true
