# ===================================================================
# ShopHere E-Commerce Backend Configuration
# ===================================================================

# Server Port
server.port=8080

# -------------------------------------------------------------------
# MySQL Database Connection (Primary)
# -------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------
# JPA & Hibernate Settings
# -------------------------------------------------------------------
# Automatically create / update database tables based on Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# -------------------------------------------------------------------
# H2 In-Memory DB (Uncomment below if running without MySQL)
# -------------------------------------------------------------------
# spring.datasource.url=jdbc:h2:mem:ecommercedb;DB_CLOSE_DELAY=-1
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# spring.h2.console.enabled=true

# Seed Initial 20 Products on Startup if database is empty
app.seed.products=true

